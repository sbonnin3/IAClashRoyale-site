name: Actualisation et publication du site
on:
  push:
    branches: [main]
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.retry.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Actualiser les sources publiques
        if: github.event_name != 'push'
        run: node scripts/update-catalogue.cjs --web-dir .
      - name: Vérifier et préparer la publication
        run: node scripts/check-static.cjs
      - name: Conserver le catalogue validé
        if: github.event_name != 'push'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add catalogue.json assets publication.json
          if ! git diff --cached --quiet; then
            git commit -m 'Actualiser le catalogue public valide'
            git push
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Publier le site validé
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Attendre après une erreur de déploiement
        if: steps.deployment.outcome == 'failure'
        run: sleep 20
      - name: Réessayer la publication
        if: steps.deployment.outcome == 'failure'
        id: retry
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
